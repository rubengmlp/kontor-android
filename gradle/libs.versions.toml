[versions]
agp = "8.13.1"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
hilt = "2.57.2"
hiltNavigationCompose = "1.3.0"
coreKtx = "1.17.0"
activityCompose = "1.11.0"
fragment = "1.8.9"
lifecycle = "2.9.4"
