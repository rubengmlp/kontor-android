navigation = "2.9.5"
room = "2.8.3"
datastore = "1.1.7"
biometric = "1.1.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
serialization = "1.9.0"
coroutines = "1.10.2"
junit = "4.13.2"
turbine = "1.2.1"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
